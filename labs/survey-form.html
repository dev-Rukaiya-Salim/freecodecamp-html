<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Survey Form</h1>
    <p id="description">Please fill out this form to help us improve our services.</p>
    <form id="survey-form">
      <label for="name" id="name-label" >Name:</label>
      <input id="name" type="text" placeholder="enter your name here"  required>
      <label for="email" id="email-label">Email:</label>
      <input id="email" type="email" placeholder="enter your email number" required>
      <label for="number" id="number-label">Number:</label>
      <input id="number" type="number" min="5" max="10" placeholder="insert your number here"><br><br>
      <p>Gender:</p>
      <label><input type="radio" name="gender" value="male">Male</label>
      <label><input type="radio" name="gender" value="female">Female</label>
      <p>What do you like?</p>
      <label><input type="checkbox" name="likes" value="music">Music</label>
      <label><input type="checkbox" name="likes" value="sports">Sports</label><br><br>
      <label for="country">Country:</label>
      <select id="dropdown" name="country">
        <option value="">Select one</option>
        <option value="kenya">Kenya</option>
        <option value="france">France</option>
        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments"></textarea>
        <button id="submit" type="submit">Submit</button>
    </form>
  </body>
</html>
